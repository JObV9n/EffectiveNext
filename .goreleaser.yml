version: 2

project_name: effective-next

before:
  hooks:
    - go mod tidy

builds:
  - id: effective-next
    main: ./cmd/effective-next
    binary: effective-next
    env:
      - CGO_ENABLED=1
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-linux-musl
          - CXX=zig c++ -target x86_64-linux-musl
      - goos: linux
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-linux-musl
          - CXX=zig c++ -target aarch64-linux-musl
      - goos: darwin
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-macos
          - CXX=zig c++ -target x86_64-macos
      - goos: darwin
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-macos
          - CXX=zig c++ -target aarch64-macos
      - goos: windows
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-windows-gnu
          - CXX=zig c++ -target x86_64-windows-gnu

archives:
  - id: effective-next
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: effective-next-dev
    name: effective-next
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Tag }}"
  header: |
    ## effectiveNext {{ .Tag }}

    High-performance build accelerator for Next.js.
  footer: |
    **Full Changelog**: https://github.com/effective-next-dev/effective-next/compare/{{ .PreviousTag }}...{{ .Tag }}

brews:
  - repository:
      owner: effective-next-dev
      name: homebrew-effective-next
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/effective-next-dev/effective-next
    description: High-performance build accelerator for Next.js
    license: MIT
    install: |
      bin.install "effective-next"
    test: |
      system "#{bin}/effective-next", "--version"
